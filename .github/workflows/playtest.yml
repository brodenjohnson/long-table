# Builds the game and publishes it to GitHub Pages as a playable link.
#
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
# Public repo: runs on every push to main.
# Private repo: Pages needs a paid GitHub plan. Run it by hand from the Actions tab.

name: Playtest build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json
      - run: npm ci
      - run: npm run ipcheck
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: game/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
